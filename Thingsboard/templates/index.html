<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlphaBot — ThingsBoard Widget</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #090d14;
    --surface:  #0e1624;
    --card:     #111d2e;
    --border:   rgba(0,180,255,0.15);
    --accent:   #00b4ff;
    --accent2:  #00ffb0;
    --danger:   #ff3d3d;
    --warn:     #ffb300;
    --text:     #c8dff0;
    --muted:    #3d5a72;
    --font-ui:  'Exo 2', sans-serif;
    --font-mono:'Share Tech Mono', monospace;
    --glow:     0 0 12px rgba(0,180,255,0.45);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto auto;
    gap: 14px;
    padding: 16px;
  }

  /* ── Header ── */
  .header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
  }
  .header-title {
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    text-shadow: var(--glow);
  }
  .header-title span { color: var(--accent2); }
  .status-pill {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 4px 12px;
    border-radius: 99px;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent2);
    box-shadow: 0 0 8px var(--accent2);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50%      { opacity: 0.3; }
  }

  /* ── Camera ── */
  .camera-card {
    grid-column: 1 / -1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    position: relative;
  }
  .camera-card img {
    width: 100%;
    display: block;
    aspect-ratio: 4/3;
    object-fit: cover;
    background: #000;
  }
  .camera-overlay {
    position: absolute;
    top: 8px; left: 8px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--accent2);
    background: rgba(0,0,0,0.55);
    padding: 3px 8px;
    border-radius: 6px;
    letter-spacing: 0.06em;
  }
  .camera-overlay.rec::before {
    content: "● ";
    color: var(--danger);
    animation: pulse 1s infinite;
  }

  /* ── Sensori ── */
  .sensor-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
  }
  .card-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .sensor-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 0;
    border-top: 1px solid rgba(255,255,255,0.04);
  }
  .sensor-name {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px;
  }
  .ir-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.2s, box-shadow 0.2s;
  }
  .ir-dot.active {
    background: var(--accent2);
    box-shadow: 0 0 8px var(--accent2);
  }
  .sensor-val {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 99px;
    background: rgba(255,255,255,0.05);
    color: var(--muted);
    transition: background 0.2s, color 0.2s;
  }
  .sensor-val.on { background: rgba(0,255,176,0.1); color: var(--accent2); }
  .sensor-ts {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    margin-top: 10px;
  }

  /* ── Controller ── */
  .controller-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .dpad {
    display: grid;
    grid-template-areas:
      ".    fwd  ."
      "lft  stp  rgt"
      ".    bwd  .";
    gap: 8px;
  }
  .dpad-btn {
    width: 64px; height: 64px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--accent);
    font-size: 22px;
    border-radius: 10px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.1s, transform 0.1s, box-shadow 0.1s;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  .dpad-btn:active, .dpad-btn.pressed {
    background: rgba(0,180,255,0.12);
    box-shadow: var(--glow);
    transform: scale(0.91);
  }
  .btn-fwd { grid-area: fwd; }
  .btn-lft { grid-area: lft; }
  .btn-stp { grid-area: stp; background: rgba(255,61,61,0.08); color: var(--danger); border-color: rgba(255,61,61,0.25); }
  .btn-rgt { grid-area: rgt; }
  .btn-bwd { grid-area: bwd; }

  /* Slider velocità */
  .speed-row {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--muted);
  }
  .speed-row input[type=range] {
    flex: 1;
    accent-color: var(--accent);
    height: 4px;
  }
  #speed-val { color: var(--accent); min-width: 30px; text-align: right; }

  /* Figure */
  .figures-row {
    width: 100%;
    display: flex;
    gap: 6px;
  }
  .fig-btn {
    flex: 1;
    padding: 7px 0;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: background 0.15s, color 0.15s;
  }
  .fig-btn:hover { background: rgba(0,180,255,0.08); color: var(--accent); }

  /* ── Log ── */
  .log-card {
    grid-column: 1 / -1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    max-height: 130px;
    overflow-y: auto;
  }
  .log-entry {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    padding: 3px 0;
    border-top: 1px solid rgba(255,255,255,0.03);
    display: flex;
    gap: 10px;
  }
  .log-time { color: #2a4055; }
  .log-cmd  { color: var(--accent); }
  .log-rpc  { color: var(--accent2); }
  .log-err  { color: var(--danger); }
</style>
</head>
<body>

<!-- ── Header ── -->
<header class="header">
  <div class="header-title">Alpha<span>Bot</span> Control</div>
  <div class="status-pill">
    <span class="status-dot"></span>
    <span id="conn-label">LIVE</span>
  </div>
</header>

<!-- ── Camera ── -->
<div class="camera-card">
  <img id="cam-img" src="" alt="Camera stream">
  <div class="camera-overlay rec" id="cam-label">CAM · LIVE</div>
</div>

<!-- ── Sensori ── -->
<div class="sensor-card">
  <p class="card-label">Sensori IR</p>
  <div class="sensor-row">
    <span class="sensor-name">
      <span class="ir-dot" id="dot-sx"></span>Sinistro
    </span>
    <span class="sensor-val" id="val-sx">--</span>
  </div>
  <div class="sensor-row">
    <span class="sensor-name">
      <span class="ir-dot" id="dot-dx"></span>Destro
    </span>
    <span class="sensor-val" id="val-dx">--</span>
  </div>
  <p class="sensor-ts" id="sensor-ts">in attesa…</p>
</div>

<!-- ── Controller ── -->
<div class="controller-card">
  <p class="card-label" style="align-self:flex-start">Motori</p>

  <div class="dpad">
    <button class="dpad-btn btn-fwd" data-cmd="FORWARD">▲</button>
    <button class="dpad-btn btn-lft" data-cmd="LEFT">◀</button>
    <button class="dpad-btn btn-stp" data-cmd="STOP">■</button>
    <button class="dpad-btn btn-rgt" data-cmd="RIGHT">▶</button>
    <button class="dpad-btn btn-bwd" data-cmd="BACKWARD">▼</button>
  </div>

  <div class="speed-row">
    <span>VEL</span>
    <input type="range" id="speed-slider" min="20" max="100" value="50">
    <span id="speed-val">50</span>
  </div>

  <div class="figures-row">
    <button class="fig-btn" data-cmd="CERCHIO">⟳ Cerchio</button>
    <button class="fig-btn" data-cmd="QUADRATO">□ Quadrato</button>
    <button class="fig-btn" data-cmd="TRIANGOLO">△ Triangolo</button>
  </div>
</div>

<!-- ── Log ── -->
<div class="log-card" id="log"></div>

<script>
// ── Configurazione ─────────────────────────────────────────────────────────
// Sostituisci con l'IP del Raspberry Pi sulla rete locale
// (ThingsBoard custom widget gira nel browser dell'operatore)
const ROBOT_BASE = "http://RASPBERRY_PI_IP:5000";

// ── Camera stream ──────────────────────────────────────────────────────────
document.getElementById("cam-img").src = `${ROBOT_BASE}/video_feed`;

// ── Log ────────────────────────────────────────────────────────────────────
function addLog(text, cls = "log-cmd") {
  const log = document.getElementById("log");
  const now = new Date().toLocaleTimeString("it-IT");
  const el  = document.createElement("div");
  el.className = "log-entry";
  el.innerHTML = `<span class="log-time">${now}</span><span class="${cls}">${text}</span>`;
  log.prepend(el);
  while (log.children.length > 20) log.removeChild(log.lastChild);
}

// ── Invio comandi via HTTP ─────────────────────────────────────────────────
const speedSlider = document.getElementById("speed-slider");
const speedVal    = document.getElementById("speed-val");
speedSlider.addEventListener("input", () => {
  speedVal.textContent = speedSlider.value;
});

async function sendCmd(cmd) {
  const speed = parseInt(speedSlider.value);
  try {
    const res = await fetch(`${ROBOT_BASE}/cmd`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cmd, speed }),
    });
    const data = await res.json();
    addLog(`CMD → ${cmd}  spd=${speed}  [${data.status}]`, "log-cmd");
  } catch (e) {
    addLog(`ERRORE: ${e.message}`, "log-err");
  }
}

// D-pad
document.querySelectorAll(".dpad-btn").forEach(btn => {
  const cmd = btn.dataset.cmd;
  const isStop = cmd === "STOP";

  btn.addEventListener("mousedown",  () => sendCmd(isStop ? "STOP" : "START_" + cmd[0]));
  btn.addEventListener("mouseup",    () => { if (!isStop) sendCmd("STOP"); });
  btn.addEventListener("mouseleave", () => { if (!isStop) sendCmd("STOP"); });
  btn.addEventListener("touchstart", e  => { e.preventDefault(); sendCmd(isStop ? "STOP" : "START_" + cmd[0]); });
  btn.addEventListener("touchend",   e  => { e.preventDefault(); if (!isStop) sendCmd("STOP"); });
});

// Figure
document.querySelectorAll(".fig-btn").forEach(btn => {
  btn.addEventListener("click", () => sendCmd(btn.dataset.cmd));
});

// ── Polling sensori ────────────────────────────────────────────────────────
function setSensor(id, dotId, val) {
  const on = Boolean(val);
  document.getElementById(dotId).className = "ir-dot" + (on ? " active" : "");
  const el = document.getElementById(id);
  el.className = "sensor-val" + (on ? " on" : "");
  el.textContent = on ? "ON" : "OFF";
}

async function pollSensors() {
  try {
    const res  = await fetch(`${ROBOT_BASE}/api/sensori`);
    const data = await res.json();
    setSensor("val-sx", "dot-sx", data.sensore_sinistro);
    setSensor("val-dx", "dot-dx", data.sensore_destro);
    document.getElementById("sensor-ts").textContent =
      "aggiornato " + new Date().toLocaleTimeString("it-IT");
  } catch {
    document.getElementById("sensor-ts").textContent = "errore lettura sensori";
  }
}

pollSensors();
setInterval(pollSensors, 500);

addLog("Widget inizializzato", "log-rpc");
</script>
</body>
</html>
